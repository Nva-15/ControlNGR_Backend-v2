# Control NGR - sistema completo (base de datos + backend + frontend)
#
#   docker compose up -d --build
#
# Requiere:
#   - Un archivo .env junto a este archivo (copiar de .env.example y completar).
#   - El repositorio del frontend clonado junto a este:
#       ./ControlNGR_Backend-v2
#       ./ControlNGR_Frontend-v2     (o indique otra ruta en FRONTEND_DIR)
#
# Solo el frontend (nginx) queda expuesto. El backend y MySQL no se publican fuera
# de Docker; MySQL solo escucha en 127.0.0.1 del servidor para mantenimiento.
services:
  db:
    image: mysql:8.0
    container_name: controlngr-db
    restart: unless-stopped
    environment:
      TZ: America/Lima
      MYSQL_DATABASE: ${DB_NAME:-controlngr}
      # El sistema se conecta con el usuario root de MySQL
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    command:
      - --default-time-zone=-05:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Menor consumo de memoria (suficiente para este sistema)
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-3307}:3306"
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    container_name: controlngr-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      STORAGE_IMG: file:/app/data/img/
      STORAGE_EVIDENCIAS: /app/data/evidencias
      # Memoria maxima de Java (subir si hay muchos usuarios y RAM disponible)
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseSerialGC}
      # La IP real del cliente llega desde nginx; solo se confia en la red interna de Docker
      FORWARD_HEADERS_STRATEGY: native
      TRUSTED_PROXIES: '172\.28\.\d{1,3}\.\d{1,3}'
    volumes:
      - img_data:/app/data/img
      - evidencias_data:/app/data/evidencias
    expose:
      - "8080"
    networks: [interna]

  frontend:
    build: ${FRONTEND_DIR:-../ControlNGR_Frontend-v2}
    container_name: controlngr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # IP fija del servidor: se incluye en el certificado HTTPS generado automaticamente
      SERVIDOR_IP: ${SERVIDOR_IP:-}
      SERVIDOR_NOMBRE: ${SERVIDOR_NOMBRE:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      # Certificado HTTPS (se genera solo; ca.crt se importa en cada PC). Nunca se sube a git
      - ./certs:/etc/nginx/certs
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [interna]

networks:
  interna:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  db_data:
  img_data:
  evidencias_data:

# =====================================================
# Control NGR - Configuracion
# -----------------------------------------------------
# Los valores sensibles NO se escriben aqui. Se leen de
# variables de entorno o del archivo .env (fuera de git).
# Ver .env.example para la lista completa.
# =====================================================
spring.application.name=ControlNGR
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# IP real del cliente cuando hay un proxy (nginx) delante.
# none = se usa la IP de la conexion directa (recomendado sin proxy).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:127\\.0\\.0\\.1}

# =====================================================
# Base de datos MySQL
# =====================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:controlngr}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:controlngr}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# Flyway: crea las tablas y datos iniciales al iniciar
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate solo valida que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# =====================================================
# Zona horaria
# =====================================================
spring.jackson.time-zone=America/Lima

# =====================================================
# Seguridad (JWT)
# =====================================================
jwt.secret=${JWT_SECRET}
# Expiracion del token en segundos (10 horas)
jwt.expiration=${JWT_EXPIRATION:36000}

# =====================================================
# Almacenamiento de archivos
# =====================================================
# Fotos de perfil (se sirven publicamente en /img/**)
app.storage.location=${STORAGE_IMG:file:./data/img/}
# Evidencias de solicitudes (solo accesibles via API autorizada)
app.storage.evidencias=${STORAGE_EVIDENCIAS:./data/evidencias}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# =====================================================
# Recursos estaticos (frontend compilado)
# =====================================================
spring.web.resources.static-locations=classpath:/static/
spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC,FORWARD,INCLUDE
spring.mvc.dispatch-options-request=true

# =====================================================
# Email (SMTP)
# =====================================================
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Sistema Control NGR}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =====================================================
# Logging
# =====================================================
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.apache.catalina=OFF
logging.level.com.example.ControlNGR=${LOG_LEVEL_APP:INFO}
